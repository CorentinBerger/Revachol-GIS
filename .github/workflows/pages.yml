name: Publish Revachol website
on:
  push:
    branches: [website]
    paths:
      - 'website/**'
      - 'vectors/**'
      - 'rasters/**'
      - 'disco_elysium_revachol_GIS.qgz'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install GDAL
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin python3-qgis python3-pyqt5
      - name: Convert GeoPackages to GeoJSON
        run: python3 website/scripts/build_geojson.py
      - name: Render QGIS symbology and rasters
        env:
          QT_QPA_PLATFORM: offscreen
        run: /usr/bin/python3 website/scripts/render_qgis.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: website
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
